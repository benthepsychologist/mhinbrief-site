    source_url: https://cpbao.ca/members/professional-practice/standards-of-professional-conduct/
    source_quote: '"16.2 Adherence to Local Jurisprudence — Registrants must be familiar with and adhere
      to the local jurisprudence and standards for practice in the jurisdiction in which the service is
      being delivered. Where a conflict exists between the requirements of two jurisdictions, the registrant
      must comply with the obligations affording greater client protection." — CPBAO, Standards of Professional
      Conduct, Standard 16.2 (in force 2024-07-01)'
