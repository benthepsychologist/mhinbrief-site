    documentation_required: true
    source_url: https://www.ontario.ca/laws/statute/04p03
    source_quote: '"(2) ... if personal health information about an individual that is in the custody
      or control of a health information custodian is stolen or lost or if it is used or disclosed without
      authority, the health information custodian shall, (a) notify the individual at the first reasonable
      opportunity of the theft or loss or of the unauthorized use or disclosure; and (b) include in the
      notice a statement that the individual is entitled to make a complaint to the Commissioner..." —
      PHIPA, s. 12(2)'
