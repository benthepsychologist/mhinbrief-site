    source_quote: '"5.3.1 College registrants using online platforms and providing virtual services shall:
      explain to clients the limits of confidentiality (including any particular limits associated with
      online platforms and/or virtual practice) prior to or during the first online meeting and document
      this conversation; ensure that the collection, use and storage of client information complies with
      applicable privacy legislation; and ensure that client information is stored in a jurisdiction where
      the privacy laws are consistent with Ontario laws or, where applicable, Canadian federal laws."
