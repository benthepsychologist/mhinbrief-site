    clinician_facing_obligations: 'When delivering electronic social work services, social workers must:
      confirm service users can access and use the technology, understand its purpose and operation, have
      their needs met and their identity protected (6.5.1); use safeguards such as password protection,
      encryption and secure firewalls when sharing confidential information digitally or on storage devices
      (6.5.2); follow applicable legislation in the province where they are regulated, where they practise,
      AND where the service user resides (6.5.3); be aware of inter-jurisdictional issues and act to preserve
      privacy and confidentiality (6.5.4); obtain informed consent before using search engines or social
      media to gather information about service users, except in exceptional circumstances to protect
      those at risk (6.5.5); make reasonable efforts to verify identity and contact information and represent
      themselves accurately (6.5.6); and be competent in the technologies used, applying face-to-face
      supervision standards to supervision delivered by technological means (6.5.7). Service users must
      be informed: to be alone in a private area and refrain from cellular phone use during the encounter
      (6.5.8); that telephone, video, text and electronic messaging provide limited security (6.5.9);
      of the risks of sharing confidential information over the internet, social media, text and videoconferencing
