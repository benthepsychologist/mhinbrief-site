    clinician_facing_obligations: Nursing services rendered to an individual within a nurse-patient relationship
      are exempt from GST/HST. This matters to behavioural-health practice because where provincial law
      permits a nurse to provide psychotherapy within their scope of nursing practice, CRA treats the
      nursing exemption at s. 6 as the applicable provision rather than the psychotherapy exemption added
      in 2024 — so the test is the nurse-patient relationship, not the s. 7 practitioner definition.
    vendor_facing_obligations: null
    consent_required: false
    documentation_required: false
    source_url: https://laws-lois.justice.gc.ca/eng/acts/e-15/page-120.html
    source_quote: '"6 A supply of a nursing service rendered to an individual by a registered nurse, a
      registered nursing assistant, a licensed or registered practical nurse or a registered psychiatric
      nurse, if the service is rendered within a nurse-patient relationship." — Excise Tax Act, Schedule
      V, Part II, s. 6 (Justice Laws consolidation, Act current to 2026-06-14)'
