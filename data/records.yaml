    clinician_facing_obligations: All professional standards apply equally to electronic, telephonic,
      in-person or hybrid practice. Obtain informed consent for the use of electronic media; take reasonable
      steps to ensure the technology is secure, confidential and appropriate to the client; confirm liability
      insurance covers electronic services BEFORE treating; comply with professional licensing requirements
      in the jurisdictions where clients are located; keep written/text/email correspondence in the clinical
      record; and do not rely on computer-generated assessments without exercising professional judgment.
      There is no requirement to live or work in Ontario to hold CRPO registration.
