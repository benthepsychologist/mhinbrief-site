    clinician_facing_obligations: 'Hold professional liability insurance (or other malpractice coverage
      or liability protection) in the form and amount set by the Board. The minimum amount set by the
      Board is $1,000,000 per occurrence. Applies to holders of a Practising Licence AND a Candidate Psychologist
      Conditional Licence. Proof of coverage must be provided within 30 days of the licence being granted,
      and maintaining coverage is a condition of annual renewal. Employer-provided coverage does not automatically
      satisfy this — NSRP''s position is that institutional coverage may not cover all acts of an employee
      and that psychologists employed by health institutions, school boards and universities still require
      personal coverage. One standing exemption exists: Correctional Service Canada employees practising
      only within CSC, under a monitored annual-declaration arrangement between NSRP and CSC. Other federal
      employees must submit proof of their own coverage. Retired, relocated or career-changed registrants
      are advised to maintain coverage or obtain extended-reporting (''tail'') coverage, because policies
      are typically written on a claims-made basis.'
    vendor_facing_obligations: null
    consent_required: false
    documentation_required: true
    source_url: https://www.ns-rp.ca/downloads/Insurance.pdf
    source_quote: '"Under the Regulated Health Professions Act and the Psychology Regulations (s. 11(1)(a)(iii)),
      an applicant for a licence must have professional liability insurance or another form of malpractice
      coverage or liability protection in the form and amount set by the Board. This applies to holders
      of a Practising Licence and a Candidate Psychologist Conditional Licence. The minimum amount set
      by the Board is $1,000,000 per occurrence." — NSRP, Professional Liability Insurance Required of
