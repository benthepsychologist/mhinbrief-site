    penalties: 'On conviction: a natural person is liable to a fine of not more than $200,000, imprisonment
      of not more than 1 year, or both; a non-natural person to a fine of not more than $1,000,000 (s.
      72(2)). Most s. 72 offences require WILFUL conduct — ordinary negligence is not an offence, though
      it can still ground an IPC order. Prosecution requires the Attorney General''s consent (s. 72(5)).'
    clinician_facing_obligations: 'Two different duties with two different triggers, and the asymmetry
      is the point. NOTICE TO THE INDIVIDUAL has NO threshold: on any theft, loss, or unauthorised use
      or disclosure of personal health information, notify the individual at the first reasonable opportunity
      and state in the notice that they may complain to the Commissioner (s. 12(2)). NOTICE TO THE IPC
      does have a threshold, set by O. Reg. 329/04 s. 6.3(1): theft is an automatic trigger, while other
      incidents run through a significance test weighing whether the information is sensitive, the volume
      involved, how many individuals are affected, and whether more than one custodian or agent was responsible.
      For a psychotherapy practice the sensitivity limb means even a single-client breach can clear that
      bar.'
    vendor_facing_obligations: null
