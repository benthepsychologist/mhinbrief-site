    clinician_facing_obligations: 'Anyone providing psychological services to a person PHYSICALLY IN ONTARIO
      must be CPBAO-registered — telepsychology included, regardless of where the practitioner sits. Practising
      outside Ontario: the registrant must be legally authorised in that jurisdiction, must comply with
      Ontario''s requirements while practising elsewhere, must tell recipients the College can address
      complaints and give College contact information on request, and must carry liability insurance covering
      that service. Where two jurisdictions conflict, comply with whichever obligation gives the client
      greater protection. Cloud services must be hosted where security features are consistent with Ontario
      privacy law, and client identity must be verified where visual verification isn''t possible.'
    vendor_facing_obligations: null
